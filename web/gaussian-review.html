<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video2World Gaussian six-view review</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./object-review.css" />
    <link rel="stylesheet" href="./gaussian-review.css" />
  </head>
  <body>
    <main class="review-shell">
      <header class="review-header">
        <div>
          <p class="review-kicker">Video2World Gaussian gate</p>
          <h1 id="object-title">Loading Gaussian object</h1>
        </div>
        <dl class="review-stats" id="review-stats" aria-live="polite"></dl>
      </header>
      <section class="review-grid" id="review-grid" aria-label="Six-view Gaussian review"></section>
      <p class="review-status" id="review-status" role="status">Loading standard GraphDECO PLY...</p>
    </main>
    <div class="review-render-stage" id="review-render-stage" aria-hidden="true"></div>
    <script type="module" src="./gaussian-review.js"></script>
  </body>
</html>
