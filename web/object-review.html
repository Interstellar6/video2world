<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video2World object geometry review</title>
    <link rel="stylesheet" href="./object-review.css" />
  </head>
  <body>
    <main class="review-shell">
      <header class="review-header">
        <div>
          <p class="review-kicker">Video2World geometry gate</p>
          <h1 id="object-title">Loading object</h1>
        </div>
        <dl class="review-stats" id="review-stats" aria-live="polite"></dl>
      </header>
      <section class="review-grid" id="review-grid" aria-label="Six-view object review"></section>
      <p class="review-status" id="review-status" role="status">Loading geometry...</p>
    </main>
    <script type="module" src="./object-review.js"></script>
  </body>
</html>
