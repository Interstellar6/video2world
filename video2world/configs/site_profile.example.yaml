# Copy this file and provide every named root explicitly to `video2world site-init`.
# Paths are never guessed from the current machine. The referenced site drivers
# are deployment-owned wrappers that must call the real upstream repositories.
schema_version: "1.0"
profile_id: holi-pgsr-sam3-qwen-trellis2-site
description: Full twelve-stage provider execution; no stage adopts historical outputs.
provider_environment:
  SITE_PYTHON:
    root_kind: artifact
    root: envs
    relative_path: video2world/bin/python
    expected_kind: executable
  SITE_DRIVERS_ROOT:
    root_kind: checkout
    root: site_drivers
    expected_kind: directory
  VIDEO2WORLD_ROOT:
