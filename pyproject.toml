[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "video2world"
version = "0.1.0"
description = "Recoverable orchestration and contracts for layered, queryable 3D worlds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
]

[project.scripts]
video2world = "video2world.cli:main"

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "ruff==0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["video2world"]

[tool.hatch.build]
include = [
  "video2world/**/*.py",
  "video2world/configs/*.yaml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"examples/bedroom4/**/*.py" = ["E501", "RUF001", "RUF002", "RUF003"]
"scripts/build_pipeline_pdf.py" = ["E501", "RUF001", "RUF002", "RUF003"]
