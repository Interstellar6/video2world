[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video2world-modeling"
version = "0.1.0"
description = "Strictly modular Video2World modeling orchestration"
requires-python = ">=3.9"

[project.scripts]
world-modeling = "world_modeling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
